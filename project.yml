name: GhostyApp
options:
  bundleIdPrefix: com.fixtergeek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Nada de reinventar el renderizador: swift-markdown-ui es el estándar de la
# comunidad para GFM en SwiftUI (MIT) y trae tablas, bloques de código y temas.
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GhostyApp:
    type: application
    platform: iOS
    sources:
      - path: GhostyApp
    dependencies:
      - package: MarkdownUI
    info:
      path: GhostyApp/Info.plist
      properties:
        CFBundleDisplayName: Ghosty
        UILaunchScreen:
          UIColorName: bg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fixtergeek.ghostyapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: primary
        TARGETED_DEVICE_FAMILY: "1"
