name: GhostyApp
options:
  bundleIdPrefix: com.fixtergeek
  deploymentTarget:
    # 17.4 y no 17.0: el callback del login es un Universal Link, y sólo el
    # inicializador `ASWebAuthenticationSession(url:callback:)` —iOS 17.4— sabe
    # interceptar un https://. Con el de `callbackURLScheme:` la hoja se queda
    # cargando la página y el login no termina nunca.
    iOS: "17.4"
  createIntermediateGroups: true

# Nada de reinventar el renderizador: swift-markdown-ui es el estándar de la
# comunidad para GFM en SwiftUI (MIT) y trae tablas, bloques de código y temas.
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: E77EZQG9YS
    GHOSTY_COMMIT: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GhostyApp:
    type: application
    platform: iOS
    # `Core/` es el núcleo que comparten las apps (Personal hoy, Work después): datos,
    # cliente de gs, hilo, markdown y el sistema de diseño. Lo de ESTA app —pantallas,
    # RootView, icono— se queda en `GhostyApp/`.
    sources:
      - path: GhostyApp
      - path: Core
    dependencies:
      - package: MarkdownUI
      # La entrada «Enviar a Ghosty» de la hoja de compartir (ver EnviarAGhosty/).
      - target: EnviarAGhosty
      # El avatar de cada agente en sus avisos (ver NotificationService/).
      - target: NotificationService
    # ⚠️ El xcconfig ya NO lleva credenciales: se entra con la cuenta de
    # ghosty.studio. Se conserva sólo para GHOSTY_COMMIT y ajustes locales de
    # firma; si el archivo no existe, la app compila igual.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    entitlements:
      path: GhostyApp/GhostyApp.entitlements
      properties:
        # Los DOS hacen falta y por razones distintas: `applinks` hace que el
        # callback del login sea https:// (un scheme propio lo puede registrar
        # otra app y quedarse con el código) y `webcredentials` es lo que permite
        # los passkeys. El dominio tiene que ser EXACTAMENTE el del AASA que
        # sirve ghosty.studio, con www.
        com.apple.developer.associated-domains:
          - applinks:www.ghosty.studio
          - webcredentials:www.ghosty.studio
        # ⚠️ El ENTORNO de APNs lo decide el build, no esta línea: `development` vale para
        # lo que se instala por cable, y Xcode lo cambia a `production` al archivar para
        # TestFlight. Equivocarse ahí no da ningún error — simplemente no llega nada.
        aps-environment: development
        # Un turno DETENIDO esperando tu permiso atraviesa un Focus con razón. Sin esto,
        # `interruption-level: time-sensitive` se ignora y el aviso espera a que mires.
        com.apple.developer.usernotifications.time-sensitive: true
        # Avisos de COMUNICACIÓN: el aviso lleva el nombre y el fantasma del agente que
        # contestó, como un chat. Con varios agentes, «Tu agente terminó» no decía cuál.
        com.apple.developer.usernotifications.communication: true
        # Lo que comparte con la extensión «Enviar a Ghosty»: el contenedor (archivos que
        # se abren en el compositor, el consentimiento de IA) y el llavero (la sesión).
        # ⚠️ El grupo del llavero es el app id de la APP a propósito: es donde ya viven la
        # sesión y los agentes, así que no hay nada que migrar.
        com.apple.security.application-groups:
          - group.com.fixtergeek.ghostyapp
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.fixtergeek.ghostyapp
    info:
      path: GhostyApp/Info.plist
      properties:
        CFBundleDisplayName: Ghosty
        # Poppins (OFL, Core/Resources/Fonts): los títulos, igual que la web. Sin esta lista
        # iOS no la registra y `Font.custom` cae a la del sistema SIN avisar.
        UIAppFonts:
          - Poppins-Medium.ttf
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
          # Inter (variable, OFL): el cuerpo del chat, igual que la web.
          - Inter-Variable.ttf
          # Source Serif 4 (variable, OFL): las respuestas del agente, como claude.ai
          # (serifa para quien contesta, sin serifa para ti).
          - SourceSerif4-Variable.ttf
        # ⚠️ Sin esto XcodeGen escribe «1.0» fijo en el Info.plist e ignora MARKETING_VERSION:
        # con la 1.0 aprobada en la tienda, Apple rechaza toda build nueva (2026-09-25).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # El scheme que cierra la hoja del login. Sin esta declaración,
        # ASWebAuthenticationSession no reconoce el callback y la sesión no termina.
        CFBundleURLTypes:
          - CFBundleURLName: com.fixtergeek.ghostyapp
            CFBundleURLSchemes:
              - com.fixtergeek.ghostyapp
        # Sin esta clave, App Store Connect pregunta por cumplimiento de
        # exportación en CADA subida y bloquea el build hasta contestarla.
        # false = sólo se usa el HTTPS del sistema, que está exento.
        ITSAppUsesNonExemptEncryption: false
        # ⚠️ La VARIABLE, no un literal. xcodegen hornea aquí el valor de
        # `CURRENT_PROJECT_VERSION` del project.yml, así que sin esta línea el
        # `CURRENT_PROJECT_VERSION=N` que pasa `subir-testflight.sh` a xcodebuild NO llega
        # al Info.plist: el .ipa sale con otro número, App Store Connect lo ignora por
        # duplicado y NO manda correo. Tres subidas perdidas el 2026-09-09 por esto.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GhostyCommit: $(GHOSTY_COMMIT)
        # ⚠️ SIN estas dos, la app NO avisa: se CIERRA en el momento de abrir el selector.
        # iOS mata el proceso al pedir un permiso que no está declarado. El texto lo lee la
        # persona en el diálogo, así que dice para qué, no que "se necesita acceso".
        NSPhotoLibraryUsageDescription: Para que puedas mandarle una foto a tu agente.
        NSPhotoLibraryAddUsageDescription: Para guardar en tu galería los videos e imágenes que te entrega tu agente.
        NSCameraUsageDescription: Para tomar una foto y mandársela a tu agente.
        NSMicrophoneUsageDescription: Para grabar notas de voz y mandárselas a tu agente.
        # Despertar en el fondo cuando el servidor manda un push silencioso, para traerte
        # la respuesta ANTES de que abras la app. Es oportunista a propósito: iOS lo limita
        # a unos pocos por hora entre todas las apps del teléfono y no lo entrega si mataste
        # la app desde el conmutador — por eso el aviso de «terminó» va como push VISIBLE y
        # esto es sólo un adelanto.
        UIBackgroundModes:
          - remote-notification
        # Lo que la extensión de avisos dona para pintar al agente como remitente.
        NSUserActivityTypes:
          - INSendMessageIntent
        # ⚠️ Con el fantasma, no un color plano. El arranque enseñaba dos fotogramas en
        # blanco antes de que SwiftUI pintara nada: no es lentitud —son los milisegundos
        # normales del sistema— pero se lee como un parpadeo roto. Con la imagen, esos
        # mismos milisegundos se leen como la app abriéndose.
        UILaunchScreen:
          UIColorName: bg
          UIImageName: ghosty-lila
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fixtergeek.ghostyapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: primary
        TARGETED_DEVICE_FAMILY: "1"

  # «Enviar a Ghosty» en la hoja de compartir. Es una ACCIÓN (`com.apple.ui-services`):
  # sale en la lista de abajo, como «Ask Gemini» o «Send to Manus». Compila `Core/` entero
  # para mandar por el MISMO camino que la app (subida a /me/files + el POST del turno).
  EnviarAGhosty:
    type: app-extension
    platform: iOS
    sources:
      - path: EnviarAGhosty
      - path: Core
      # El icono de la hoja de compartir es su propio AppIcon (EnviarAGhosty/Assets.xcassets):
      # silueta blanca sobre fondo TRANSPARENTE, porque iOS pinta las acciones como plantilla
      # por su alfa; con el icono de la app salía un cuadro gris.
    dependencies:
      - package: MarkdownUI
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    entitlements:
      path: EnviarAGhosty/EnviarAGhosty.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fixtergeek.ghostyapp
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.fixtergeek.ghostyapp
    info:
      path: EnviarAGhosty/Info.plist
      properties:
        CFBundleDisplayName: Enviar a Ghosty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Poppins-Medium.ttf
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
          - Inter-Variable.ttf
          - SourceSerif4-Variable.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: ActionViewController
          NSExtensionAttributes:
            NSExtensionActionWantsFullScreenPresentation: false
            NSExtensionServiceAllowsFinderPreviewItem: true
            # Hasta 8 cosas, como el compositor: PDFs, imágenes, videos, cualquier
            # archivo, un enlace o texto.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 8
              NSExtensionActivationSupportsFileWithMaxCount: 8
              NSExtensionActivationSupportsImageWithMaxCount: 8
              NSExtensionActivationSupportsMovieWithMaxCount: 8
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fixtergeek.ghostyapp.enviar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: primary
        TARGETED_DEVICE_FAMILY: "1"
        # Lo que en `Core/` sólo existe en la app (registrarse en APNs, escenas) se
        # apaga con esta condición.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GHOSTY_EXTENSION"

  # Los avisos de «terminó» llegan con el avatar y el nombre del agente (aviso de
  # comunicación). ⚠️ Una extensión de avisos vive con ~24 MB: NO compila `Core/`, sólo
  # lleva su código y las imágenes del fantasma.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Core/Assets.xcassets
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fixtergeek.ghostyapp
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Avisos de Ghosty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fixtergeek.ghostyapp.notifications
        TARGETED_DEVICE_FAMILY: "1"

  # ⚠️ No se instala ni se distribuye: existe para que `Core/` compile SOLO. Si algo del
  # núcleo empieza a depender de una pantalla de la app, este target se pone rojo antes
  # de que la segunda app lo descubra.
  GhostyCore:
    type: framework
    platform: iOS
    sources:
      - path: Core
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fixtergeek.ghostycore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # ⚠️ Existe para poder TOCAR la pantalla. Se enviaron cinco builds seguidas con fallos
  # de interacción —una fila que no responde, un botón que no hace nada— porque lo único
  # que se verificaba era que compilara. Corre contra el modo demo (`GHOSTY_DEMO=1`), que
  # es lo que deja abrir la app sin sesión.
  GhostyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GhostyAppUITests
    dependencies:
      - target: GhostyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fixtergeek.ghostyapp.uitests
        TEST_TARGET_NAME: GhostyApp
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GhostyCore:
    build:
      targets:
        GhostyCore: all
  GhostyApp:
    build:
      targets:
        GhostyApp: all
        GhostyAppUITests: [test]
    test:
      targets:
        - GhostyAppUITests
